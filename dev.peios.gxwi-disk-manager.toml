# What Disk Manager is to a desktop (PGSS Applications): installed as
# /usr/share/apps/dev.peios.gxwi-disk-manager.toml, named for the id, by
# the package that installs the program. It is a window and nothing else.
title = "Disk Manager"
description = "See this machine's disks, partitions and mounts, and change them"
program = "/usr/bin/gxwi-disk-manager"
