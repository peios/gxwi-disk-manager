[package]
name = "gxwi-disk-manager"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Beside this checkout until a libgxwi with the settings kit is released.
libgxwi = { path = "../gxwi/libgxwi" }
# Mount policies, the person's privileges and descriptors in words. Every
# crate in one program must pin the same revision: `peios-sys` links
# libpeios, and a program can hold only one.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "02c87cb643c30eef6b74cd1d9d8b0ae067bed69a", package = "peios" }
# The permissions a mount gives files without their own, and those of a new
# filesystem's top folder.
gxwi-sd-editor = { path = "../gxwi-sd-editor", default-features = false, features = ["names"] }
# lsblk's and stratafs's answers, which are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# How full a filesystem is (statvfs).
libc = "0.2"
